<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة المنتجات | Flora Admin</title><link rel="icon" href="/Store/frontend/images/logo.svg"><link rel="stylesheet" href="/Dashboard/frontend/css/common.css"><link rel="stylesheet" href="/Dashboard/frontend/css/products.css"></head><body><div class="admin-layout"><div id="sharedNav"></div><main class="container"><div id="pageNotice" class="notice" hidden></div><div class="page-head"><div><h1>المنتجات</h1><p class="muted">إدارة الاسم والسعر والمخزون والصورة</p></div><div class="form-actions"><button id="refreshBtn" class="secondary">تحديث</button><button id="exportBtn" class="secondary">تصدير CSV</button><button id="addBtn">+ إضافة منتج</button></div></div><div class="toolbar"><input id="search" type="search" aria-label="البحث في المنتجات" placeholder="بحث بالاسم أو التصنيف أو اللون"><select id="filter"><option value="all">كل المنتجات</option><option value="active">نشطة</option><option value="inactive">غير نشطة</option><option value="low">مخزون منخفض (5 قطع أو أقل)</option></select></div><section class="panel"><div id="productsTable" class="table-wrap"><div class="empty">جارٍ تحميل المنتجات…</div></div></section><dialog id="productDialog"><form id="productForm"><div class="dialog-head"><h2 id="dialogTitle">إضافة منتج</h2><button type="button" class="secondary" id="closeDialog">إغلاق</button></div><input id="productId" type="hidden"><div class="form-grid"><label>اسم المنتج<input id="name" required></label><label>التصنيف<input id="category" required></label><label>السعر (ج.م)<input id="price" type="number" min="0" step=".01" required></label><label>المخزون<input id="stock" type="number" min="0" step="1" required></label><label>اللون<input id="colorName" required></label><label>كود اللون<input id="colorHex" placeholder="#000000"></label><label>Group Key<input id="groupKey" required></label><label>ترتيب العرض<input id="sortOrder" type="number" value="0"></label><label class="wide">صورة المنتج من الجهاز<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/avif"><small>PNG/JPG/WebP/AVIF حتى 5 ميجابايت.</small><img id="imagePreview" class="product-image" alt="معاينة الصورة" hidden></label><label class="wide">الوصف<textarea id="description" rows="3"></textarea></label><label><input id="active" type="checkbox" checked> نشط</label><label><input id="featured" type="checkbox"> مميز</label></div><div class="form-actions"><button type="submit">حفظ المنتج</button></div></form></dialog></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/Shared/frontend/js/supabase-config.js"></script><script src="/Dashboard/frontend/js/admin-common.js"></script><script src="/Dashboard/frontend/js/products.js"></script></body></html>
